# Contract for grants.jsonl: which one task may use which one credential.
#
# A credential fact is recorded once and used by almost nothing. A grant is what
# says which task is the exception, and it is written by the captain before that
# task is dispatched, never by the minion that will use it and never by SIANA on a
# minion's behalf.
#
# It is explicit and it is task-specific, and every way a grant could be inferred is
# a way it is not:
#
#   - not from the project, or every minion sent there would inherit it
#   - not from a dependency, a QA pair, or a prior grant on the same fact
#   - not from a conversation, because a conversation leaves no record to revoke
#
# Write it with `siana-fact`, never by hand:
#
#   siana-fact grant  <task-id> <slug>
#   siana-fact revoke <task-id> <slug>
#
# `grant` is accepted only while the task is still `todo`. That is what makes a
# grant a pre-dispatch decision the captain made about work they had read, rather
# than an answer to a minion that has already started and asked for it.
#
# The log is append-only, so a revocation is a record and not an erasure: `status`
# goes to `revoked` and the history of both stays readable. Nothing reads a grant
# without also reading the task, so a `granted` record whose task is no longer
# `doing` authorises nothing.
#
# `extra: forbid` is the point of keeping this in a store: a mistyped key is refused
# at write, rather than becoming an authorisation the captain believes they limited.
#
# This contract only ever grows, for the reason `schema-facts.yaml` gives beside it.

name: Grant
key: id
extra: forbid

fields:
  id:
    type: str
    pattern: '^[a-z][a-z0-9-]{2,47}/[a-z][a-z0-9-]{1,31}/[a-z][a-z0-9-]{1,47}$'
    description: '`<task>/<project>/<slug>`, derived by `siana-fact` and never
      typed. All three are in the key, so a grant can only ever name one task and
      one fact, and a second grant of the same pair updates the first rather than
      accumulating beside it'
  task:
    type: str
    pattern: '^[a-z][a-z0-9-]{2,47}$'
    description: the queue task this authorises, and only that task. The queue's own
      id grammar, so a task the queue accepts is one this can name
  fact:
    type: str
    pattern: '^[a-z][a-z0-9-]{1,31}/[a-z][a-z0-9-]{1,47}$'
    description: the `id` of the credential fact in `facts.jsonl`
  project:
    type: str
    pattern: '^[a-z][a-z0-9-]{1,31}$'
    description: the project both the task and the fact belong to, recorded rather
      than rederived. A reader checks the task's project against this and this
      against the fact's, so a record that ever disagreed with either is a refusal
      instead of a grant somebody has to notice
  status:
    type: enum
    values: [granted, revoked]
    default: granted
    description: revocation is a status and not a deletion, because a credential
      that was once reachable from a task is a thing the captain may need to see
      afterwards
  granted:
    type: datetime
    description: stamped by `siana-fact`, because an agent must never type the clock
  revoked:
    type: datetime
    required: false
    description: absent for as long as the grant stands
