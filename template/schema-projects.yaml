# Contract for projects.jsonl: the captain's registry of what SIANA works on.
#
# The captain owns this registry. SIANA reads it every session and `siana-dispatch`
# resolves a task's project handle through it, so one record decides both what SIANA
# knows and where a minion actually runs.
#
# Add or change a project with the store, never by hand-editing the log:
#
#   datafile -f projects.jsonl put --set handle=tasks \
#       --set path='~/vvonkledge/sandbox/tasks' --set ship='just check'
#
# `put` writes a whole record, so changing one field means restating the required
# ones. Read the record first (`datafile -f projects.jsonl get <handle>`), then put
# it back with the change.
#
# `extra: forbid` is the point of keeping this in a store: a mistyped key is refused
# at write, rather than becoming a setting the captain believes they made.

name: Project
key: handle
extra: forbid

fields:
  handle:
    type: str
    pattern: '^[a-z][a-z0-9-]{1,31}$'
    description: what the captain calls this project in conversation
  path:
    type: str
    min_length: 1
    description: where minions run and where verification happens
  ship:
    type: str
    required: false
    description: the project's delivery rigor; SIANA types it into `tasks add --verify`
  pipeline:
    type: bool
    default: false
    description: true when ship work here is validated by a driven pipeline rather
      than by a command that runs once at `done`. The task's verify then reads the
      run's outcome (`siana-pipeline check`) and `ship` above is what a run executes
  qa:
    type: str
    required: false
    description: independent validation of ship work; set it to put a QA minion
      behind every ship task in this project
  target:
    type: str
    required: false
    description: the branch a merge request targets. Setting it is what turns
      publishing on, so a project without one is never published and needs no
      second field to say so
  orders:
    type: str
    required: false
    description: extra standing orders for this project, relative to path
  worktree:
    type: bool
    default: true
    description: false only for a project git cannot branch, which means no isolation
  automerge:
    type: enum
    values: [merge, squash, rebase]
    required: false
    description: standing permission for SIANA to arrange the merge of a request it
      published, and the method the history is shaped with. Absent, the captain
      merges every request in person, which is what every project did before this
      field existed. There is no default, because a script choosing between a merge
      commit, a squash and a rebase would be choosing how this project's history
      reads. Setting it delegates arranging and nothing else - the forge's own
      required checks and required reviews still decide whether a merge happens -
      and it composes with `pipeline`, `qa` and `target` rather than standing in
      for any of them, so a project carrying this field without those three
      refuses to publish at all
