# Contract for obligations.jsonl: what SIANA owes the captain, and what the captain
# owes SIANA, until something answers it.
#
# A promise made mid-conversation and a decision waiting on the captain are the two
# things the fleet cannot afford to keep in chat memory. Both die with the session
# holding them, and neither has anywhere else to live: the queue holds work, and an
# obligation is not work. This store is the rest.
#
# Records are written by `siana-owe`, never by hand and never by `datafile` directly.
# The script is there because the operation that matters most cannot be done safely
# with the store alone: `put` writes a whole record, so closing an obligation by hand
# means retyping `body` from memory, and a slip there silently rewrites the promise
# it was meant to retire.
#
# `extra: forbid` is the point of keeping this in a store: a mistyped key is refused
# at write, rather than becoming an obligation SIANA believes it recorded.

name: Obligation
key: id
extra: forbid

fields:
  id:
    type: str
    pattern: '^[a-z][a-z0-9-]{2,47}$'
    description: derived from the body by `siana-owe`, so it is self-describing later
  kind:
    type: enum
    values: [promise, decision]
    description: a promise is what SIANA owes; a decision is what only the captain can answer
  body:
    type: str
    min_length: 1
    max_length: 300
    description: the obligation in the captain's terms - an outcome, never the mechanics
  status:
    type: enum
    values: [open, closed]
    default: open
  task:
    type: str
    required: false
    description: the queue task this is about, when it is about one
  opened:
    type: datetime
    description: stamped by `siana-owe`, because an agent must never type the clock
  closed:
    type: datetime
    required: false
  answer:
    type: str
    required: false
    description: the durable event that retired this; absent for as long as it is open
