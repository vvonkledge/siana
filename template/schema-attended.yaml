# Contract for attended.jsonl: the reasoning behind every decision the captain was
# actually asked, so that what the captain decides becomes something later versions
# of SIANA can learn a policy from.
#
# This is not a second obligation store and it is not the advisory ledger.
#
#   - `obligations.jsonl` holds the question and, once the captain answers, the
#     answer. That store is the single source of truth for whether a decision is
#     still open and for what the captain said. Nothing here duplicates either.
#   - `decisions.jsonl` holds what SIANA *would* have done while the captain was
#     away. Nobody was asked, so no answer exists and none ever will.
#   - This holds what the obligation has no room for and the ledger has no right to:
#     the situation as SIANA framed it, the options it laid out, the consequence it
#     attached to each one, which it recommended, why, and - much later - what
#     actually happened.
#
# A record here is keyed by the obligation id, so the corpus is a join and never a
# copy: `siana-owe history` reads both stores and reports one row per decision. That
# is what keeps the captain's answer in exactly one place. A copy of it here would be
# a second source of truth about the one fact this whole arrangement exists to
# preserve, and the copy is the one that would go stale.
#
# It only ever grows, for the reason `schema-decisions.yaml` gives: removing a live
# field does not fail loudly, it makes every record still carrying it vanish from
# `get` and `list`. A learning corpus that silently drops history is worse than no
# corpus, because the gap is invisible in the thing that reads it.
#
# Records are written by `siana-owe`, never by hand and never by `datafile` directly.
# `opened` and `outcome_at` are stamped by the script, because an agent must never
# type the clock.
#
# This is a reporting and learning foundation only. Nothing reads `recommendation` as
# permission, and no command anywhere turns a row of this store into an action. The
# captain's answer is still the only thing that decides.

name: AttendedDecision
key: id
extra: forbid

fields:
  id:
    type: str
    pattern: '^[a-z][a-z0-9-]{2,47}$'
    description: >-
      the obligation id this reasons about. The same id in obligations.jsonl
      carries the question, its status and the captain's answer, and this carries
      nothing that is already there
  opened:
    type: datetime
    description: >-
      stamped by `siana-owe`, because an agent must never type the clock
  situation:
    type: str
    min_length: 1
    max_length: 2000
    description: >-
      what made this a decision, in the captain's terms. The obligation's `body` is
      one line and has to be; this is where the state of the world that produced it
      is written down, because a recommendation read a year later without it is
      unjudgeable
  options:
    type: list
    items: str
    default: []
    description: >-
      what the captain may choose between, one string each. `siana-owe` refuses
      fewer than two, because a decision with one option is a notification, and
      recording it as a decision teaches the corpus that the captain agreed to
      something they were never offered an alternative to
  consequences:
    type: list
    items: str
    default: []
    description: >-
      what follows from each option, positionally aligned with `options`.
      `siana-owe` refuses a length mismatch, because a consequence list read against
      the wrong option is worse than none
  recommendation:
    type: str
    min_length: 1
    max_length: 300
    description: >-
      which option SIANA would choose. An advisory field with no executable meaning
      anywhere in this distro. It is recorded so that the corpus can later be asked
      how often SIANA and the captain agreed, which is the whole measurement
      autonomy would ever have to be argued from
  rationale:
    type: str
    min_length: 1
    max_length: 2000
    description: >-
      why SIANA would choose it. The diff records what happened and nothing else
      records the reasoning, which is the half a policy is learned from
  task:
    type: str
    required: false
    description: >-
      the queue task this decision is about, when it is about one
  project:
    type: str
    required: false
    description: >-
      the project handle this decision is about, when it is about one
  outcome:
    type: str
    required: false
    max_length: 2000
    description: >-
      what actually happened once the captain's answer was carried out. Written long
      after the answer, by `siana-owe outcome`, and refused while the obligation is
      still open, because an outcome recorded before an answer is a guess, and a
      guess in a learning corpus is training data that teaches the wrong thing
  outcome_at:
    type: datetime
    required: false
    description: >-
      stamped by `siana-owe` when the outcome was recorded
